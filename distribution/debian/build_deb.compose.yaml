name: oscr_ui_deb_build

services:
  oscr_ui_deb_build:
    image: oscruideb
    build:
      context: ../..
      dockerfile: distribution/debian/deb_build_base.Dockerfile
    container_name: running_oscr_ui_deb_build
    volumes:
      - type: bind
        source: ../../
        target: /mnt/
        read_only: false
    command:
      - /bin/sh
      - -c
      - |
        cd /build
        cd /build
        cp -r /mnt/distribution/ /mnt/assets/ /mnt/OSCRUI/ /mnt/main.py /mnt/pyproject.toml /mnt/LICENSE /mnt/README.md ./
        distribution/build_pyinstaller.sh
        distribution/debian/package_deb.sh
        mkdir -p /mnt/dist
        cp dist/oscr-ui.deb /mnt/dist/oscr-ui.deb
